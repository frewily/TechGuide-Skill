name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run content regression tests
        run: bash tests/check-content.sh
